DATASET: 'CustomDataset'
DATA_PATH: 'data/custom_soil_box_260923'

# Actual data extent is only +/-3 m (x,y) and z in [-0.1, 1.7].
# The old +/-74.88 m KITTI range left ~99.7% of the heatmap empty, which made
# the focal loss / gradient explode (~1500 loss, ~65000 grad norm) and NaN.
# +/-4.8 m gives ~1.8 m margin for random rotation/scale augmentation.
POINT_CLOUD_RANGE: [-4.8, -4.8, -2, 4.8, 4.8, 4]

# These names are only used to route CustomDataset results through the
# repository's KITTI evaluator; the training labels remain Soil and Box.
MAP_CLASS_TO_KITTI: {
    'Soil': 'Car',
    'Box': 'Van',
}

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [custom_infos_train.pkl],
    'test': [custom_infos_val.pkl],
}

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity'],
    src_feature_list: ['x', 'y', 'z', 'intensity'],
}

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder']
    AUG_CONFIG_LIST:
        - NAME: gt_sampling
          USE_ROAD_PLANE: False
          DB_INFO_PATH:
              - custom_dbinfos_train.pkl
          PREPARE: {
             filter_by_min_points: ['Soil:5', 'Box:5'],
          }
          SAMPLE_GROUPS: ['Soil:1', 'Box:1']
          NUM_POINT_FEATURES: 4
          DATABASE_WITH_FAKELIDAR: False
          REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
          LIMIT_WHOLE_SCENE: True

        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    # The one-stage DSVT configuration uses a single vertical voxel plane.
    - NAME: transform_points_to_voxels_placeholder
      VOXEL_SIZE: [0.08, 0.08, 6]
