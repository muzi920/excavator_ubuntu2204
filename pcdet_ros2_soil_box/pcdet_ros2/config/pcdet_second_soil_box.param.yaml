pcdet:
  ros__parameters:
    config_file: "cfgs/custom_models/dsvt_soil_box_260923.yaml"
    model_file: "checkpoints/checkpoint_epoch_80.pth"
    allow_memory_fractioning: False
    allow_score_thresholding: True
    num_features: 4
    device_id: 0
    device_memory_fraction: 0.8
    # Keep this at zero when the training point clouds use zero intensity.
    intensity_scale: 0.0
    timestamp_scale: 1.0
    # Keep the best detection for each class: at most one Soil and one Box.
    max_detections_per_frame: 0
    max_detections_per_class: 1
    # Highest-point output is meaningful only for detected Soil.
    highest_point_classes: ["Soil"]
    highest_point_marker_scale: 0.15
    highest_point_text_height: 0.15
    highest_point_text_offset: 0.25
    # Temporal smoothing of the Soil highest point (EMA). Smaller alpha =
    # smoother but more lag; 0.0 freezes, 1.0 disables smoothing.
    highest_point_smoothing_alpha: 0.35
    # Keep publishing the last smoothed point for this many frames when the
    # Soil is temporarily not detected.
    highest_point_hold_frames: 5
    # If the raw point jumps further than this (m) from the smoothed one,
    # re-anchor immediately instead of smoothing across the gap.
    highest_point_max_jump: 2.0
    # Nudge the selected Soil highest point along z. Negative = shift the
    # published digging point DOWN (currently -0.1 m).
    highest_point_z_offset: -0.1
    # Temporal smoothing of the 3D detection boxes (per class). Same meaning
    # as the highest-point settings above: alpha=EMA strength, hold_frames=
    # frames to keep publishing after a detection drops out, max_jump (m) =
    # re-anchor instantly when the box center moves further than this.
    box_smoothing_alpha: 0.5
    box_hold_frames: 5
    box_max_jump: 2.0
    # Threshold order follows CLASS_NAMES: [Soil, Box].
    threshold_array: [0.3, 0.3]
