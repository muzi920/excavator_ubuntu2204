# ============================================================
# 9. 倾角传感器补偿滤波参数
# ============================================================
tilt_compensation:
  alpha: 0.98
  calib_count: 50
  gyro_deadzone_rad_s: 0.002
  auto_calibrate_on_open: true
  use_relative_subtraction: true


# ============================================================
# 10. 可达域/工作空间约束（WorkspaceChecker，任务1 FR-1）
# ============================================================
workspace:
  # ===== 下挖最低点（米）=====
  #   ground plane 基准 = z=0.0（base_link 底面在地面）
  #   负数 = 允许铲斗下探到地面以下：
  #     -0.10 = 下挖 10 厘米（默认，对应 TR6.3 / AC-3 真实校准）
  #     -1.00 = 下挖 1 米（用户在测试中提到的"下挖最低点为 1m"时改成这个值）
  #   注意：mode="dig" 时只检查 min_ground_z；mode="transit" 时同时检查下面的 min_transit_z（转运禁止撞地）
  min_ground_z:              -0.1
  # 转运姿态的最小离地高度（米）。转运任务下 z 必须 ≥ 此值，避免小臂/铲斗在移动中刮蹭地面
  min_transit_z:              0.3
  # 奇异位姿 margin：最小数值 + 占最大臂展的比例比例取最大值使用
  singularity_margin_min_m:   0.02
  singularity_margin_ratio:   0.01


# ============================================================
# 11. 轨迹规划默认参数（TrajectoryPlanner，任务2 FR-3）
# ============================================================
trajectory:
  default_strategy: "lerp"    # 默认策略："lerp"（液压均匀）或 "trapezoidal"（加/减速限幅）
  lerp_step_deg: 5.0          # lerp 策略：关节空间最大角位移的等分步长（度）
  max_speed_deg_s:            # 梯形策略：每个关节的最大角速度（度/秒）
    swing_yaw:    15
    boom_swing:   20
    arm_boom:     30
    bucket_arm:   30
  accel_deg_s2:               # 梯形策略：每个关节的最大角加速度（度/秒²）
    swing_yaw:    30
    boom_swing:   40
    arm_boom:     60
    bucket_arm:   60
